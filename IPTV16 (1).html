<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Junflix - IPTV Premium</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>

    <style>
        :root { --red: #E50914; --black: #141414; --gray: #2f2f2f; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Arial', sans-serif; background: var(--black); color: #fff; overflow-x: hidden; }

        /* Header Junflix */
        header {
            padding: 15px 4%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
            display: flex; justify-content: space-between; align-items: center;
            position: fixed; top: 0; width: 100%; z-index: 1000;
        }
        .logo { color: var(--red); font-size: 32px; font-weight: bold; text-transform: uppercase; }

        .top-nav { display: flex; gap: 15px; align-items: center; }
        input#url { background: #333; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 4px; width: 200px; }
        
        /* Botão Cast Estilizado */
        google-cast-launcher {
            width: 40px; height: 40px; cursor: pointer;
            background: rgba(255,255,255,0.1); border-radius: 50%;
            display: inline-block !important; /* Força aparecer */
        }

        /* Área do Player */
        .hero { width: 100%; height: 60vh; background: #000; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: contain; }

        /* Grade de Canais (Estilo Netflix) */
        .content { padding: 30px 4%; }
        h2 { margin-bottom: 20px; font-weight: normal; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }

        .card {
            background: var(--gray); border-radius: 4px; overflow: hidden;
            cursor: pointer; transition: transform 0.3s ease; position: relative;
            aspect-ratio: 16/9;
        }
        .card:hover { transform: scale(1.1); z-index: 50; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card .title {
            position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.8);
            padding: 5px; font-size: 11px; text-align: center;
        }

        @media (max-width: 600px) {
            .hero { height: 35vh; }
            input#url { width: 120px; font-size: 12px; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
        }
    </style>
</head>
<body>

<header id="nav">
    <div class="logo">JUNFLIX</div>
    <div class="top-nav">
        <input type="text" id="url" value="https://iptv-org.github.io/iptv/countries/br.m3u">
        <button onclick="loadList()" style="background:var(--red); color:#fff; border:none; padding:10px; cursor:pointer; border-radius:4px; font-weight:bold;">OK</button>
        <google-cast-launcher></google-cast-launcher>
    </div>
</header>

<div class="hero">
    <video id="player" controls autoplay playsinline></video>
</div>

<div class="content">
    <h2 id="cat-name">Minha Lista de Canais</h2>
    <div id="grid" class="grid"></div>
</div>

<script>
    const video = document.getElementById('player');
    const hls = new Hls();
    let channels = [];

    // Inicializa o Cast Context
    window.__onGCastApiAvailable = function(isAvailable) {
        if (isAvailable) {
            cast.framework.CastContext.getInstance().setOptions({
                receiverApplicationId: chrome.cast.media.DEFAULT_RECEIVER_APP_ID,
                autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
            });
        }
    };

    async function loadList() {
        const url = document.getElementById('url').value;
        try {
            const res = await fetch(url);
            const data = await res.text();
            parse(data);
        } catch (e) {
            alert("Erro de segurança (CORS). Hospede o arquivo no Netlify ou GitHub.");
        }
    }

    function parse(text) {
        channels = [];
        const lines = text.split('\n');
        lines.forEach((line, i) => {
            if (line.includes('#EXTINF')) {
                const name = line.split(',')[1] || "Canal";
                const logo = line.match(/tvg-logo="([^"]+)"/)?.[1] || '';
                const stream = lines[i+1]?.trim();
                if (stream && stream.startsWith('http')) {
                    channels.push({ name, logo, stream });
                }
            }
        });
        render();
    }

    function render() {
        const grid = document.getElementById('grid');
        grid.innerHTML = channels.map(c => `
            <div class="card" onclick="play('${c.stream}')">
                <img src="${c.logo || 'https://via.placeholder.com/300x168?text=JUNFLIX'}" onerror="this.src='https://via.placeholder.com/300x168?text=TV'">
                <div class="title">${c.name}</div>
            </div>
        `).join('');
    }

    function play(url) {
        // Envia para a TV se estiver conectado
        const session = cast.framework.CastContext.getInstance().getCurrentSession();
        if (session) {
            const mediaInfo = new chrome.cast.media.MediaInfo(url, 'application/x-mpegurl');
            const request = new chrome.cast.media.LoadRequest(mediaInfo);
            session.loadMedia(request);
        }

        // Toca no navegador
        if (Hls.isSupported()) {
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.play();
        } else {
            video.src = url;
            video.play();
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.onload = loadList;
</script>
</body>
</html>
